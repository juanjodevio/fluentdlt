version: "3.9"

services:
  pg-source:
    image: postgres:15-alpine
    container_name: fldt_pg_source
    environment:
      POSTGRES_DB: fldt_source
      POSTGRES_USER: fldt
      POSTGRES_PASSWORD: fldt
    ports:
      - "5532:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - pg_source_data:/var/lib/postgresql/data

  pg-dest:
    image: postgres:15-alpine
    container_name: fldt_pg_dest
    environment:
      POSTGRES_DB: fldt_dest
      POSTGRES_USER: fldt
      POSTGRES_PASSWORD: fldt
    ports:
      - "5542:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - pg_dest_data:/var/lib/postgresql/data

volumes:
  pg_source_data:
  pg_dest_data:

