[project]
name = "fldt"
version = "0.1.0"
description = "Fluent Data Loading Toolkit — Write ETL pipelines that read like English"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "dlt>=0.3.0",
    "pandas>=2.0.0",
    "fsspec[s3]>=2023.0.0",
    "typer>=0.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]
duckdb = [
    "duckdb>=0.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = []
