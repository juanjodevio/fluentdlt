[project]
name = "fldt"
version = "0.1.0"
description = "Fluent Data Loading Toolkit — Write ETL pipelines that read like English"
readme = "README.md"
requires-python = ">=3.10, <4.0"
dependencies = [
    "dlt[sql_database]>=1.5.0",
    "sqlalchemy>=2.0.0",
]

[project.optional-dependencies]
duckdb = [
    "duckdb>=0.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]
