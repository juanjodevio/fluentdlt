[project]
name = "fldt"
version = "0.1.0"
description = "Fluent Data Loading Toolkit — Write ETL pipelines that read like English"
readme = "README.md"
requires-python = ">=3.10, <4.0"
license = { text = "Apache-2.0" }
authors = [
    { name = "Juan Palomino M." }
]
keywords = ["dlt", "etl", "data", "pipeline", "fluent", "sql"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Database",
]

dependencies = [
    "dlt[sql_database]>=1.5.0",
    "sqlalchemy>=2.0.0",
]

[project.optional-dependencies]
duckdb = [
    "duckdb>=0.9.0",
]
all = [
    "duckdb>=0.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "isort>=5.12.0",
    "types-psycopg2>=2.9.21",
    "tox>=4.32.0",
]
integration = [
    "alembic>=1.13.0",
    "psycopg2-binary>=2.9.0",
    "duckdb>=0.9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests/unittest", "tests/integration"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
]
markers = [
    "integration: integration tests that require external dependencies (deselect with '-m \"not integration\"')",
]

[tool.coverage.run]
source = ["src/fldt"]
omit = ["tests/*", "**/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["tests.*"]
allow_untyped_defs = true
allow_incomplete_defs = true
allow_untyped_calls = true
disable_error_code = [
    "index",
    "call-arg",
    "arg-type",
    "type-arg",
    "typeddict-item",
    "assignment",
    "unused-ignore",
]

[[tool.mypy.overrides]]
module = [
    "tests.unittest.test_types",
    "tests.unittest.test_builder",
    "tests.unittest.test_transformers",
    "tests.unittest.test_executor",
]
allow_untyped_defs = false
allow_incomplete_defs = false
allow_untyped_calls = false
disable_error_code = []

[[tool.mypy.overrides]]
module = [
    "tests.integration.alembic.*",
    "tests.integration.conftest",
    "tests.integration.test_integration",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["alembic", "alembic.*", "duckdb", "duckdb.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501", # line too long (handled by black)
]

[tool.black]
line-length = 88
target-version = ["py310", "py311", "py312"]
include = '\.pyi?$'
